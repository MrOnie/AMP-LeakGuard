[project]
name = "amp-leakguard"
version = "0.1.0"
description = "Rigorous Benchmarking and De-biasing of Machine Learning Predictors for Bioactive Peptides"
authors = [
    { name = "Ronie Martínez", email = "ronie.martinez@epn.edu.ec" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.83",
    "lightgbm>=4.3.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "optuna>=3.6.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.0",
    "shap>=0.45.0",
    "tqdm>=4.66.0",
]

[project.urls]
Homepage = "https://github.com/MrOnie/AMP-LeakGuard"
Repository = "https://github.com/MrOnie/AMP-LeakGuard"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv]
link-mode = "copy"

